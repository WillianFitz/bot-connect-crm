name = "bot-connect-crm-api"
main = "src/worker.ts"
compatibility_date = "2025-01-01"

# URL base da API em produção (ajuste conforme seu domínio do Pages/Worker)
route = ""

[[d1_databases]]
binding = "DB"
database_name = "bot_connect_crm"
# Substitua abaixo pelo ID real do D1 no painel da Cloudflare
database_id = "3932c953-ad50-4977-aa3d-3eb2b5f8e892"

# Disparo automático de campanhas: roda a cada 1 minuto
[triggers]
crons = ["* * * * *"]

[vars]
BOT_SERVICE_URL = "https://bot-connect-crm-production.up.railway.app"
EXTRACTOR_SERVICE_URL = "https://extrator-instagram-production.up.railway.app"
EVOLUTION_API_URL = "evolution-api-production-9edc.up.railway.app"
EVOLUTION_API_KEY = "Sudo@0412"
# JWT_SECRET: defina como Secret no dashboard da Cloudflare (Variables and Secrets)
ALLOWED_ORIGINS = "https://bot-connect-crm.pages.dev,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8787"

