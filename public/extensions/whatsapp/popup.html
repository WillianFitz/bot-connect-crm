<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Extrator WhatsApp</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
        margin: 0; padding: 14px; width: 200px;
        background: #09090b; color: #71717a; font-size: 11px; text-align: center;
      }
      .logo { display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:8px; }
      .logo-icon {
        width:24px; height:24px; border-radius:6px; flex-shrink:0;
        background:linear-gradient(135deg,hsl(192,91%,52%),hsl(265,80%,60%));
        display:flex; align-items:center; justify-content:center;
      }
      .logo-text { font-size:12px; font-weight:700; color:#e4e4e7; }
      .err { font-size:11px; color:#f87171; margin-top:4px; }
    </style>
  </head>
  <body>
    <div class="logo">
      <div class="logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="13" height="13">
          <path d="M14 2 L6 14 H11 L10 22 L18 10 H13 Z" fill="hsl(222,47%,6%)"/>
        </svg>
      </div>
      <span class="logo-text">Extrator WhatsApp</span>
    </div>
    <div id="msg">Abrindo painel...</div>
    <div class="err" id="err" style="display:none">
      WhatsApp Web não está aberto.<br>Acesse web.whatsapp.com primeiro.
    </div>
    <script src="popup.js"></script>
  </body>
</html>
